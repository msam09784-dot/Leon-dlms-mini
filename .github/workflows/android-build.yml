name: Build LEON AUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*SOURCE*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/leon-audio-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/leon-audio-source"
          SETTINGS_FILE="$(find "$RUNNER_TEMP/leon-audio-source" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "File settings.gradle tidak ditemukan."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "File gradlew tidak ditemukan."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Change app branding to LEON AUDIO
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.kt' -o -name '*.xml' -o -name '*.kts' -o -name '*.properties' \) -print0 \
            | xargs -0 -r sed -i -e 's/CRT AUDIO/LEON AUDIO/g' -e 's/CRT_AUDIO/LEON_AUDIO/g'

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          APK_FILE="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK_FILE"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/LEON-AUDIO-DLMS-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEON-AUDIO-DLMS-APK
          path: LEON-AUDIO-DLMS-debug.apk
          if-no-files-found: error
          retention-days: 14
