name: Build LEON AUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*SOURCE*.zip' -print -quit)
          test -n "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/leon"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/leon"
          SETTINGS=$(find "$RUNNER_TEMP/leon" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Change app branding
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.kt' -o -name '*.xml' \) -exec sed -i 's/CRT AUDIO/LEON AUDIO/g' {} +

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/LEON-AUDIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEON-AUDIO-APK
          path: LEON-AUDIO.apk
          retention-days: 14
          
